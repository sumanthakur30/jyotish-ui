# astro.sugamflow.com — jyotish-ui + jyotish-service
# After DNS A → 16.192.54.132: sudo certbot --nginx -d astro.sugamflow.com

server {
    listen 80;
    server_name astro.sugamflow.com;
    client_max_body_size 20m;

    root /var/www/astro-ui;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Staff desk uses X-Tenant-Id only (no JWT yet). Hit the engine directly.
    location /api/v1/jyotish/ {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
