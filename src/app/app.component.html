<header class="top">
  <div class="brand">
    <span class="mark">SJ</span>
    <div>
      <h1>Sugam Jyotish</h1>
      <p class="tag">Phase 9 · Astrologer CRM</p>
    </div>
  </div>
  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Profiles</a>
    <a *ngIf="can('matching')" routerLink="/matching" routerLinkActive="active">Matching</a>
    <a routerLink="/panchang" routerLinkActive="active">Panchang</a>
    <a routerLink="/clients" routerLinkActive="active">Clients</a>
    <a routerLink="/appointments" routerLinkActive="active">Appointments</a>
  </nav>
  <div class="tenant-bar">
    <label for="tenant">Tenant</label>
    <input
      id="tenant"
      [(ngModel)]="tenantDraft"
      name="tenant"
      placeholder="JYOTISH-DEMO-01"
    />
    <button type="button" class="btn" (click)="saveTenant()">Set</button>
    <button type="button" class="btn ghost" (click)="refreshStatus()">Ping</button>
  </div>
</header>

<main class="shell">
  <p class="flash ok" *ngIf="message">{{ message }}</p>
  <p class="flash err" *ngIf="error">{{ error }}</p>
  <section class="panel upgrade" *ngIf="showUpgradeBanner">
    <p>{{ upgradeHint('Kundali &amp; core Jyotish') }}</p>
  </section>
  <section class="panel compact" *ngIf="status as s">
    <span>{{ s.service }}</span>
    <span>· {{ s.phase }}</span>
    <span>· engine {{ s.engineVersion }}</span>
    <span *ngIf="s.entitlementEnabled">· entitlements on</span>
  </section>
  <router-outlet></router-outlet>
</main>
