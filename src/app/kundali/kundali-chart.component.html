<figure
  class="ni-wrap"
  [class.compact]="compact"
  [class.full-labels]="planetLabelMode === 'full'"
>
  <figcaption *ngIf="caption">{{ caption }}</figcaption>
  <svg
    class="ni-svg"
    viewBox="0 0 400 400"
    role="img"
    [attr.aria-label]="caption || 'North Indian kundali'"
  >
    <!-- Classical North Indian: square + both diagonals + inner diamond (12 houses). -->
    <rect class="frame" x="1" y="1" width="398" height="398" />
    <line class="rule" x1="1" y1="1" x2="399" y2="399" />
    <line class="rule" x1="399" y1="1" x2="1" y2="399" />
    <polygon class="rule diamond" points="200,1 399,200 200,399 1,200" />

    <g *ngFor="let h of houseRenders(); trackBy: trackHouse">
      <text class="sign" text-anchor="middle" dominant-baseline="middle" [attr.x]="h.nx" [attr.y]="h.ny">
        {{ h.sign }}
      </text>
      <text
        *ngIf="h.lines.length"
        class="body"
        text-anchor="middle"
        [attr.x]="h.lx"
        [attr.y]="h.ly"
      >
        <tspan
          *ngFor="let line of h.lines; let i = index"
          [attr.x]="h.lx"
          [attr.dy]="i === 0 ? 0 : '1.15em'"
        >
          {{ line }}
        </tspan>
      </text>
      <text
        *ngIf="h.transitLines.length"
        class="body transit"
        text-anchor="middle"
        [attr.x]="h.lx"
        [attr.y]="h.ly + 14 + h.lines.length * 12"
      >
        <tspan
          *ngFor="let line of h.transitLines; let i = index"
          [attr.x]="h.lx"
          [attr.dy]="i === 0 ? 0 : '1.15em'"
        >
          {{ line }}
        </tspan>
      </text>
    </g>
  </svg>
</figure>
